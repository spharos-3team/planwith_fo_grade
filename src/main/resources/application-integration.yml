spring:
  config:
    activate:
      on-profile: integration
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/grade_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:grade_user}
    password: ${DB_PASSWORD:grade_pass}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${GRADE_KAFKA_CONSUMER_ENABLED:false}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8083}

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

grade:
  kafka:
    consumer-enabled: ${GRADE_KAFKA_CONSUMER_ENABLED:false}
  outbox:
    enabled: ${GRADE_OUTBOX_ENABLED:false}
