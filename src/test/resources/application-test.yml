spring:
  datasource:
    url: jdbc:h2:mem:grade;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  cloud:
    discovery:
      enabled: false
  kafka:
    listener:
      auto-startup: false
    admin:
      fail-fast: false
      auto-create: false
  data:
    redis:
      repositories:
        enabled: false

eureka:
  client:
    enabled: false

management:
  health:
    redis:
      enabled: false

grade:
  kafka:
    consumer-enabled: false
  outbox:
    enabled: false
