# Gateway route snippet for planwith-fo-grade
# Does NOT patch planwith_gateway automatically — copy each block below.
#
# 1) routes  → spring.cloud.gateway.server.webflux.routes
# 2) swagger → springdoc.swagger-ui.urls
#
# Eureka: lb://planwith-fo-grade (must match spring.application.name)
# Path: align with service @RequestMapping. Default: /api/planwith-fo-grade/**
#
# Service OpenAPI servers MUST be GATEWAY_PUBLIC_URL=/ (spring-service OpenApiConfig).
# Otherwise Swagger Try-it-out uses Docker hostname:8083 and other PCs fail.

# ── 1) routes (paste under webflux.routes) ──

            - id: planwith-fo-grade
              uri: lb://planwith-fo-grade
              predicates:
                - Path=/api/planwith-fo-grade/**
            - id: planwith-fo-grade-docs
              uri: lb://planwith-fo-grade
              predicates:
                - Path=/docs/planwith-fo-grade,/docs/planwith-fo-grade/**
              filters:
                - RewritePath=/docs/planwith-fo-grade(?<segment>/?.*), /v3/api-docs${segment}

# ── 2) swagger-ui.urls (paste under springdoc.swagger-ui.urls) ──
# routes 만 붙이면 API는 되도 Gateway Swagger 드롭다운에는 안 보임.

#      - name: planwith-fo-grade
#        url: /docs/planwith-fo-grade

# ── 3) (선택) 첫 번째로 열 서비스로 지정 ──
# springdoc.swagger-ui.urls-primary-name: planwith-fo-grade
